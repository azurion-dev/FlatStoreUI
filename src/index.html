<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlatStore</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="titlebar" data-tauri-drag-region>
    <div class="tb-brand">
      <img src="assets/flatstore-icon.svg" alt="" width="26" height="22" />
      <span>FlatStore</span>
    </div>
    <div class="win-ctl">
      <button id="win-min" aria-label="Minimize" title="Minimize">
        <svg viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M1 5h8"/></svg>
      </button>
      <button id="win-max" aria-label="Maximize" title="Maximize">
        <svg class="i-max" viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.1"><rect x="1.2" y="1.2" width="7.6" height="7.6" rx="1.2"/></svg>
        <svg class="i-restore" viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><rect x="1.2" y="3.2" width="5.6" height="5.6" rx="1"/><path d="M3.4 3.2V2.4a1.2 1.2 0 0 1 1.2-1.2h3a1.2 1.2 0 0 1 1.2 1.2v3a1.2 1.2 0 0 1-1.2 1.2h-.8"/></svg>
      </button>
      <button id="win-close" class="close" aria-label="Close" title="Close">
        <svg viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="m1.2 1.2 7.6 7.6M8.8 1.2 1.2 8.8"/></svg>
      </button>
    </div>
  </header>

  <div class="app">
    <aside class="side">
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search apps" autocomplete="off" spellcheck="false" aria-label="Search apps" />
        <kbd>/</kbd>
      </label>
      <nav id="nav" aria-label="Main"></nav>
    </aside>
    <main id="main" tabindex="-1"><div id="view"></div></main>
  </div>
  <div class="lightbox" id="lightbox" hidden><img alt="Screenshot" /></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
